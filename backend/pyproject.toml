[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cct-backend"
version = "0.0.0"
description = "Christopher Columbus Travel modular backend scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "neo4j==6.2.0",
    "pydantic==2.13.4",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
