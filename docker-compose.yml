# Localhost PoC topology (DR-0011, DR-0014). `api`/`neo4j` start with the
# default profile; `seed`/`seed-reset` remain profile-gated one-shot services
# for explicit resets. API startup conditionally refreshes the disposable
# local graph and advisor index when its persisted source manifest changes.
# Frontend containerization is intentionally
# out of scope here (see backend/scripts/seed/README.md's recorded
# limitations); this file covers only what issue #12 needed to prove the
# seed entry point end to end.
services:
  neo4j:
    image: neo4j:2025.06.0-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${CCT_NEO4J_PASSWORD:?set CCT_NEO4J_PASSWORD in the environment or a .env file}"
    volumes:
      - neo4j-data:/data
    networks:
      - cct
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: cct-backend:local
    build:
      context: ./backend
    environment:
      CCT_NEO4J_URI: bolt://neo4j:7687
      CCT_NEO4J_USER: neo4j
      CCT_NEO4J_PASSWORD: "${CCT_NEO4J_PASSWORD:?set CCT_NEO4J_PASSWORD in the environment or a .env file}"
      CCT_API_HOST: 0.0.0.0
      CCT_OLLAMA_URL: http://ollama:11434
      CCT_OLLAMA_MODEL: qwen3:8b
      CCT_ADVISOR_INDEX_PATH: /var/lib/cct/advisor-index
      CCT_SEED_STATE_PATH: /var/lib/cct/advisor-state/source-manifest.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - advisor-index:/var/lib/cct/advisor-index
      - advisor-state:/var/lib/cct/advisor-state
      - ./docs:/app/docs:ro
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - cct

  ollama:
    image: ollama/ollama:latest
    gpus: all
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cct

  ollama-pull:
    image: ollama/ollama:latest
    command: ["pull", "qwen3:8b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - cct
    profiles:
      - advisor-model

  seed:
    image: cct-backend:local
    build:
      context: ./backend
    command: ["python", "scripts/seed_data.py"]
    environment:
      CCT_NEO4J_URI: bolt://neo4j:7687
      CCT_NEO4J_USER: neo4j
      CCT_NEO4J_PASSWORD: "${CCT_NEO4J_PASSWORD:?set CCT_NEO4J_PASSWORD in the environment or a .env file}"
      CCT_ADVISOR_INDEX_PATH: /var/lib/cct/advisor-index
      CCT_SEED_STATE_PATH: /var/lib/cct/advisor-state/source-manifest.json
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - cct
    volumes:
      - advisor-index:/var/lib/cct/advisor-index
      - advisor-state:/var/lib/cct/advisor-state
      - ./docs:/app/docs:ro
    profiles:
      - seed

  seed-reset:
    image: cct-backend:local
    build:
      context: ./backend
    command: ["python", "scripts/seed_data.py", "--reset"]
    environment:
      CCT_NEO4J_URI: bolt://neo4j:7687
      CCT_NEO4J_USER: neo4j
      CCT_NEO4J_PASSWORD: "${CCT_NEO4J_PASSWORD:?set CCT_NEO4J_PASSWORD in the environment or a .env file}"
      CCT_ADVISOR_INDEX_PATH: /var/lib/cct/advisor-index
      CCT_SEED_STATE_PATH: /var/lib/cct/advisor-state/source-manifest.json
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - cct
    volumes:
      - advisor-index:/var/lib/cct/advisor-index
      - advisor-state:/var/lib/cct/advisor-state
      - ./docs:/app/docs:ro
    profiles:
      - seed

networks:
  cct:

volumes:
  neo4j-data:
  advisor-index:
  advisor-state:
  ollama-data:
