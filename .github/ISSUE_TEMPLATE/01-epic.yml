# Canonical source: docs/governance/templates/epic.md
name: Epic
description: Propose a coherent product outcome or capability area.
title: "[Epic]: "
labels:
  - epic
projects:
  - hochschule-darmstadt/2
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and rationale
      description: Describe the stakeholder outcomes and why they belong together.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Domain and capability evidence
      description: Link a primary domain or subdomain where meaningful, any additional authoritative anchors, and the rationale for cross-domain scope.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State included and excluded capabilities and link intended features.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Success evidence
      description: Describe observable epic-level outcomes.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, lifecycle considerations, and open questions
      description: Link related contexts, risks, decisions, owners, and required evidence.
