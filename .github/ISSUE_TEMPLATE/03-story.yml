# Canonical source: docs/governance/templates/story.md
name: Story
description: Define one negotiable iteration-planning outcome within a feature.
title: "[ST-NNN]: "
labels:
  - story
projects:
  - hochschule-darmstadt/2
body:
  - type: input
    id: story_id
    attributes:
      label: Story ID
      description: Enter the assigned tracker-independent ST-NNN from the governed planning artifact. Do not allocate a new ID here when the Story already exists elsewhere.
      placeholder: ST-001
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Actor outcome
      description: State the observable outcome and why this Story matters.
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: Parent feature and authoritative links
      description: Link exactly one feature and the requirements, constraints, evidence, and solution boundaries that support planning this outcome.
    validations:
      required: true
  - type: textarea
    id: planning_boundary
    attributes:
      label: Planning boundary and exclusions
      description: State enough intended inclusion and adjacent exclusion to size, sequence, and later specify the Story without defining the exact Slice.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence expectation
      description: State the observable evidence expected for Story acceptance and link authoritative examples when available.
    validations:
      required: true
  - type: textarea
    id: planning_assessment
    attributes:
      label: Relative planning assessment
      description: Record the team-confirmed relative size, planning confidence, important uncertainty, and material capacity implications.
    validations:
      required: true
  - type: textarea
    id: allocation_and_slices
    attributes:
      label: Iteration allocation and Slice mappings
      description: Link the governing Sprint Backlog and allocated SL-NNN Slice Manifests, or state Unallocated and Not specified.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, lifecycle considerations, and open questions
      description: State relevant implications, owners, and required evidence.
