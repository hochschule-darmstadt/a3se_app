# Canonical source: docs/governance/templates/feature.md
name: Feature
description: Propose one independently evaluable product capability within an epic.
title: "[Feature]: "
labels:
  - feature
projects:
  - hochschule-darmstadt/2
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and rationale
      description: Describe the observable product or operational outcome, who benefits, and why it matters.
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: Parent epic and authoritative anchors
      description: Link exactly one epic parent, the primary behavioral anchor, other relevant use cases or requirements, and explain any split or combination.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State included and excluded flows and link intended stories.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Summarize observable normal, alternative, exception, and boundary behavior.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, lifecycle considerations, and open questions
      description: Link risks, decisions, owners, and required evidence.
