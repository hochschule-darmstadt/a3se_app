# Canonical source: docs/governance/templates/feature.md
name: Feature
description: Propose a capability, behavior change, or lifecycle improvement.
title: "[Feature] "
labels:
  - feature
projects:
  - hochschule-darmstadt/2
body:
  - type: markdown
    attributes:
      value: |
        A feature issue is a planning item, not an accepted requirement. Link authoritative artifacts instead of copying or replacing them.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and rationale
      description: Describe the stakeholder or engineering outcome and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected artifacts
      description: Link source evidence, accepted requirement IDs, risks, decisions, or other authoritative artifacts. Identify assumptions and proposals.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Describe observable normal, alternative, error, and boundary behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: Lifecycle considerations
      description: Cover architecture, security, privacy, accessibility, test, operations, data, and management implications; justify anything not applicable.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: List unresolved matters, owners, and the evidence or decision needed to close them.
    validations:
      required: false
  - type: checkboxes
    id: completion
    attributes:
      label: Completion
      options:
        - label: Authoritative artifacts and affected stable IDs are updated or linked.
        - label: Acceptance evidence is present.
        - label: Relevant lifecycle reviews and checks pass.
        - label: Residual risks, skipped checks, and follow-up work are explicit.
